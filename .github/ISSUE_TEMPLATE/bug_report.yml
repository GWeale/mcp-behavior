name: Bug report
description: Report reproducible MCP Behavior behavior.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials and private tool results before posting evidence.
  - type: input
    id: version
    attributes:
      label: MCP Behavior version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, Streamable HTTP, not transport-related]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a sanitized contract and exact command when possible.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
