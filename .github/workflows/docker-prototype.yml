name: Docker prototype

on:
  pull_request:
    paths:
      - prototypes/docker/**
      - .github/workflows/docker-prototype.yml
  push:
    branches: [main]
    paths:
      - prototypes/docker/**
      - .github/workflows/docker-prototype.yml

permissions:
  contents: read

jobs:
  docker-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - run: docker build -t mcp-behavior-prototype:local -f prototypes/docker/Dockerfile .
      - run: uv run python prototypes/docker/measure.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-prototype-report
          path: .mcp-behavior/docker-prototype/
