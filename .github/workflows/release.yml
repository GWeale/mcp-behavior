name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-groups --locked
      - name: Verify tag matches the package version
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from mcp_behavior import __version__
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}" or __version__ != version:
              raise SystemExit("Release tag and package versions must agree")
          PY
      - run: uv run python scripts/release_gate.py
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish-pypi:
    if: vars.PUBLISH_PYPI == 'true'
    needs: build
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-behavior
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          docs/assets/filesystem-crlf-demo.mp4
          examples/filesystem-crlf/recording/demo.cast
          examples/filesystem-crlf/recording/transcript.txt
          examples/filesystem-crlf/recording/summary.json
          examples/filesystem-crlf/recording/state-observed.md
          --verify-tag
          --prerelease
          --title "MCP Behavior ${GITHUB_REF_NAME#v}"
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
