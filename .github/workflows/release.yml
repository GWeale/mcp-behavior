name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-groups --locked
      - run: uv run python scripts/release_gate.py
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish-pypi:
    needs: build
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-behavior
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    needs: [build, publish-pypi]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "MCP Behavior ${GITHUB_REF_NAME#v}"
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
