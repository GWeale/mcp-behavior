name: MCP Behavior
description: Compare MCP tool results and declared effects across implementations.
author: George Weale

branding:
  icon: check-square
  color: blue

inputs:
  contract:
    description: Path to the MCP Behavior YAML contract.
    required: true
  evidence:
    description: Directory for deterministic evidence.
    required: false
    default: .mcp-behavior/evidence
  report:
    description: Path for the JUnit report.
    required: false
    default: .mcp-behavior/report.xml
  python-version:
    description: Python version used by the action.
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install MCP Behavior
      shell: bash
      env:
        MCP_BEHAVIOR_SOURCE: ${{ github.action_path }}
      run: python -m pip install "${MCP_BEHAVIOR_SOURCE}"
    - name: Verify behavior
      shell: bash
      env:
        MCP_BEHAVIOR_CONTRACT: ${{ inputs.contract }}
        MCP_BEHAVIOR_EVIDENCE: ${{ inputs.evidence }}
        MCP_BEHAVIOR_REPORT: ${{ inputs.report }}
      run: >-
        mcp-behavior verify "$MCP_BEHAVIOR_CONTRACT"
        --evidence "$MCP_BEHAVIOR_EVIDENCE"
        --format junit
        --output "$MCP_BEHAVIOR_REPORT"
