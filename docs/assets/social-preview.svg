<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">MCP Behavior</title>
  <desc id="desc">Parity tests for MCP migrations, including returned values and observable side effects</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d31"/>
      <stop offset="0.58" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#090e19"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1085" cy="130" r="160" fill="#1d4ed8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1040" cy="490" r="190" fill="#14b8a6" opacity="0.09" filter="url(#glow)"/>
  <path d="M0 560C245 500 360 620 610 555S1010 505 1280 570V640H0Z" fill="#111b2c" opacity="0.7"/>

  <g transform="translate(120 112)">
    <rect width="112" height="112" rx="25" fill="#0a1020" stroke="#263349" stroke-width="2"/>
    <rect x="20" y="25" width="46" height="46" rx="9" fill="none" stroke="#94a3b8" stroke-width="6"/>
    <rect x="50" y="47" width="46" height="46" rx="9" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <path d="M35 56l10 10 25-29" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="120" y="315" fill="#f8fafc" font-size="72" font-weight="700" letter-spacing="-2">MCP Behavior</text>
    <text x="120" y="374" fill="#cbd5e1" font-size="30" font-weight="400">Parity tests for</text>
    <text x="120" y="414" fill="#cbd5e1" font-size="30" font-weight="400">MCP migrations.</text>
  </g>

  <g transform="translate(120 456)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">
    <rect width="560" height="64" rx="12" fill="#080d17" stroke="#263349" stroke-width="2"/>
    <text x="24" y="40" fill="#94a3b8">$</text>
    <text x="52" y="40" fill="#e2e8f0">mcp-behavior verify mcp-behavior.yaml</text>
  </g>

  <g transform="translate(790 166)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect width="360" height="300" rx="18" fill="#080d17" stroke="#263349" stroke-width="2"/>
    <circle cx="25" cy="25" r="6" fill="#fb7185"/>
    <circle cx="46" cy="25" r="6" fill="#fbbf24"/>
    <circle cx="67" cy="25" r="6" fill="#4ade80"/>
    <path d="M0 51h360" stroke="#263349" stroke-width="2"/>
    <text x="26" y="92" fill="#e2e8f0" font-size="19">MCP Behavior:</text>
    <text x="185" y="92" fill="#5eead4" font-size="19">MATCH</text>
    <text x="26" y="135" fill="#94a3b8" font-size="17">mode: baseline</text>
    <text x="26" y="176" fill="#5eead4" font-size="17">MATCH</text>
    <text x="119" y="176" fill="#cbd5e1" font-size="17">lookup item</text>
    <text x="48" y="213" fill="#5eead4" font-size="17">MATCH</text>
    <text x="141" y="213" fill="#cbd5e1" font-size="17">call lookup</text>
    <text x="48" y="250" fill="#5eead4" font-size="17">MATCH</text>
    <text x="141" y="250" fill="#cbd5e1" font-size="17">file effect</text>
  </g>
</svg>
