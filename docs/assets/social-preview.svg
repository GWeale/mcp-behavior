<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">MCP Behavior</title>
  <desc id="desc">Parity tests for MCP migrations, including returned values and observable side effects</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf7f7"/>
    </linearGradient>
    <linearGradient id="signal" x1="34" y1="32" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081b37"/>
      <stop offset="0.38" stop-color="#0d2c52"/>
      <stop offset="0.52" stop-color="#1e96f5"/>
      <stop offset="0.72" stop-color="#28b9c7"/>
      <stop offset="1" stop-color="#43d3a1"/>
    </linearGradient>
    <linearGradient id="mintNode" x1="17" y1="84" x2="45" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ad9ae"/>
      <stop offset="1" stop-color="#38c991"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1e96f5"/>
      <stop offset="1" stop-color="#43d3a1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d2c52" stroke-width="1" opacity="0.045"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#081b37" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#page)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="10" fill="url(#rule)"/>
  <circle cx="1165" cy="70" r="210" fill="#1e96f5" opacity="0.06"/>
  <circle cx="1020" cy="615" r="250" fill="#43d3a1" opacity="0.08"/>

  <g transform="translate(94 70) scale(1.05)">
    <path
      d="M83 32H57C42 32 34 40 34 52C34 64 43 70 55 70C63 70 65 57 72 57C80 57 82 72 91 72C104 72 112 79 112 91C112 103 103 110 90 110H45"
      fill="none"
      stroke="url(#signal)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <rect x="82" y="18" width="30" height="30" rx="7" fill="#081b37"/>
    <rect x="16" y="84" width="30" height="30" rx="7" fill="url(#mintNode)"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="96" y="290" fill="#081b37" font-size="72" font-weight="760" letter-spacing="-2.2">MCP Behavior</text>
    <text x="96" y="350" fill="#38516d" font-size="29" font-weight="430">Parity tests for MCP migrations.</text>
    <text x="96" y="392" fill="#38516d" font-size="24" font-weight="400">Compare returned values and observable side effects.</text>
  </g>

  <g transform="translate(96 454)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">
    <rect width="570" height="68" rx="14" fill="#ffffff" stroke="#cbd9e6" stroke-width="2"/>
    <circle cx="27" cy="34" r="6" fill="#43d3a1"/>
    <text x="48" y="41" fill="#25415f">mcp-behavior verify mcp-behavior.yaml</text>
  </g>

  <g transform="translate(760 120)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" filter="url(#cardShadow)">
    <rect width="422" height="392" rx="24" fill="#07162d"/>
    <rect x="1" y="1" width="420" height="390" rx="23" fill="none" stroke="#27496a" stroke-width="2"/>
    <circle cx="28" cy="28" r="6" fill="#fb7185"/>
    <circle cx="50" cy="28" r="6" fill="#fbbf24"/>
    <circle cx="72" cy="28" r="6" fill="#4ade80"/>
    <path d="M0 56H422" stroke="#27496a" stroke-width="2"/>
    <text x="30" y="103" fill="#dcecff" font-size="20">MCP Behavior:</text>
    <text x="198" y="103" fill="#55dfa9" font-size="20" font-weight="700">MATCH</text>
    <text x="30" y="145" fill="#86a4c2" font-size="17">mode: differential</text>
    <text x="30" y="198" fill="#55dfa9" font-size="18">MATCH</text>
    <text x="126" y="198" fill="#dcecff" font-size="18">tool result</text>
    <text x="52" y="238" fill="#55dfa9" font-size="18">MATCH</text>
    <text x="148" y="238" fill="#b8cde1" font-size="18">returned value</text>
    <text x="52" y="278" fill="#55dfa9" font-size="18">MATCH</text>
    <text x="148" y="278" fill="#b8cde1" font-size="18">file effect</text>
    <path d="M30 313H392" stroke="#27496a"/>
    <text x="30" y="352" fill="#86a4c2" font-size="16">evidence: .mcp-behavior/evidence</text>
  </g>
</svg>
