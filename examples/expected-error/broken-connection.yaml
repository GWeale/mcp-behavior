version: 1
name: broken-connection-example

timeouts:
  connect: 2
  operation: 2
  total: 5

targets:
  candidate:
    transport: stdio
    command: [python, server.py, --broken]
    workspace: .

scenarios:
  - name: a broken connection is not an expected tool error
    calls:
      - name: unknown item
        tool: lookup_item
        arguments:
          item_id: missing
        expect:
          outcome: error
