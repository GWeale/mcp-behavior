[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-behavior"
version = "0.1.0"
description = "Parity tests for MCP migrations, including tool results and observable side effects."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "George Weale" }]
keywords = ["mcp", "model-context-protocol", "regression-testing", "behavioral-testing", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["mcp>=2.0.0,<3", "httpx2>=2.10.0,<3", "PyYAML>=6.0.2,<7"]

[project.urls]
Homepage = "https://github.com/GWeale/mcp-behavior"
Documentation = "https://github.com/GWeale/mcp-behavior#readme"
Issues = "https://github.com/GWeale/mcp-behavior/issues"

[project.scripts]
mcp-behavior = "mcp_behavior.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_behavior"]

[tool.hatch.build.targets.sdist]
exclude = ["/AGENTS.md", "/CONTEXT.md", "/STATUS.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_behavior"]
